services:
  # ===== MySQL =====
   mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===== Backend Spring Boot =====
  backend:
    build: ./backend
    container_name: backend-app
    restart: always
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - app-network

  # ===== Frontend Angular =====
  frontend:
    build: ./frontend
    container_name: frontend-app
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app-network

  # ===== Adminer (interface web MySQL) =====
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8082:8080"
    depends_on:
      - mysql-db
    networks:
      - app-network

# ===== Volumes persistants =====
volumes:
  mysql_data:

# ===== Réseau Docker dédié =====
networks:
  app-network:
    driver: bridge
